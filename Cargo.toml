[package]
name = "sgpu"
version = "2.1.0"
edition = "2024"
rust-version = "1.93"
description = "Push-only Slurm GPU operations monitor"
license = "MIT"
default-run = "sgpu"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
libc = "0.2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "sgpu"
path = "src/main.rs"

[[bin]]
name = "sgpu-agent"
path = "src/bin/sgpu-agent.rs"

[[bin]]
name = "sgpu-collector"
path = "src/bin/sgpu-collector.rs"

[[bin]]
name = "chkgpu"
path = "src/bin/chkgpu.rs"

[[bin]]
name = "sgpu-install"
path = "src/bin/sgpu-install.rs"
